<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealingMart CAD STEP/IGES Verification Bench</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101719;color:#dfe9e5;font:14px/1.6 system-ui,sans-serif}.shell{padding:24px;max-width:1200px;margin:auto}h1{font-size:22px;margin:0 0 4px}.muted{color:#aabbb7}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;margin-top:20px}aside,.stage{background:#192124;border:1px solid #344648;border-radius:12px;padding:16px}button{display:block;width:100%;margin:8px 0;padding:10px;border:1px solid #55696a;border-radius:6px;background:#253537;color:#fff;cursor:pointer;text-align:left}.stage #viewport{width:100%;height:530px;position:relative;background:#152025;border-radius:8px;overflow:hidden}canvas{display:block}pre{overflow:auto;background:#101a1e;border-radius:6px;padding:12px;max-height:190px;font-size:11px}.good{color:#8be5ac}@media(max-width:700px){.layout{grid-template-columns:1fr}.stage #viewport{height:400px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script src="/node_modules/occt-import-js/dist/occt-import-js.js"></script>
</head><body><main class="shell"><h1>HealingMart CAD — 입증 실험실</h1><div class="muted">STEP / IGES · OpenCascade → 메시 → WebGL 실제 표시 · 운영 미연결</div>
<div class="layout"><aside><b>검증용 샘플</b>
<button data-file="block.step">STEP · Block (40×30×20mm)</button>
<button data-file="cylinder.step">STEP · Cylinder (r10×30mm)</button>
<button data-file="inch-block.step">STEP · Inch normalization</button>
<button data-file="open-surface.step">STEP · Open surface</button>
<button data-file="assembly.step">STEP · Assembly</button>
<a href="https://www.cadprops.com/samples/box.iges" target="_blank" rel="noopener noreferrer" style="color:#8bdcbb;display:block;padding:12px 0">IGES 샘플 원본에서 받기</a><div class="muted">IGES는 내려받은 후 파일 선택으로 열어주세요.</div>
<label>다른 STEP / IGES 파일<input type="file" id="upload" accept=".step,.stp,.iges,.igs"></label></aside>
<section class="stage"><div id="status">준비</div><div id="viewport"></div><pre id="result">파일을 선택하세요.</pre></section></div></main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const el=document.getElementById('viewport');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);renderer.setClearColor(0x152025);el.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x465866,2.2));const light=new THREE.DirectionalLight(0xffffff,2.7);light.position.set(5,10,8);scene.add(light);
const cam=new THREE.PerspectiveCamera(45,el.clientWidth/el.clientHeight,.01,10000);cam.position.set(90,75,110);const orbit=new OrbitControls(cam,renderer.domElement);orbit.enableDamping=true;
let current=null;let occtPromise=window.occtimportjs({locateFile:p=>'/node_modules/occt-import-js/dist/'+p});
function fit(o){const box=new THREE.Box3().setFromObject(o),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());orbit.target.copy(center);cam.position.copy(center.clone().add(new THREE.Vector3(1.3,1.2,1.5).normalize().multiplyScalar(Math.max(size.length()*1.6,1))));cam.near=Math.max(.001,size.length()/10000);cam.far=Math.max(100,size.length()*100);cam.updateProjectionMatrix();orbit.update()}
async function show(bytes,name){
 const status=document.getElementById('status');status.textContent='해석 중 · '+name;
 try{
  const occt=await occtPromise;
  const raw=/\.(step|stp)$/i.test(name)?occt.ReadStepFile(new Uint8Array(bytes),null):occt.ReadIgesFile(new Uint8Array(bytes),null);
  if(!raw.success||!raw.meshes?.length)throw new Error('메시 생성 실패');
  if(current){scene.remove(current);current.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}
  const group=new THREE.Group();let triangles=0,vertices=0;
  for(const mesh of raw.meshes){
   const pos=mesh.attributes.position.array,idx=mesh.index.array;
   const geom=new THREE.BufferGeometry();
   geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
   geom.setIndex(idx);if(mesh.attributes.normal?.array)geom.setAttribute('normal',new THREE.Float32BufferAttribute(mesh.attributes.normal.array,3));else geom.computeVertexNormals();
   const mat=new THREE.MeshStandardMaterial({color:0x74d8c7,roughness:.58,metalness:.05,side:THREE.DoubleSide});
   const obj=new THREE.Mesh(geom,mat);group.add(obj);
   triangles+=idx.length/3;vertices+=pos.length/3;
  }
  current=group;scene.add(group);fit(group);
  const b=new THREE.Box3().setFromObject(group);const dims=b.getSize(new THREE.Vector3());
  const data={filename:name,success:raw.success,meshes:raw.meshes.length,vertices,triangles,dimsMm:[dims.x,dims.y,dims.z].map(v=>Math.round(v*1000)/1000)};
  document.getElementById('result').textContent=JSON.stringify(data,null,2);status.textContent='렌더링 성공 · '+name;status.className='good';window.__cadTestResult=data;
 }catch(e){document.getElementById('result').textContent=e.stack||e.message;status.textContent='실패 · '+name;status.className='';window.__cadTestResult={filename:name,success:false,error:e.message}}
}
for(const b of document.querySelectorAll('[data-file]'))b.addEventListener('click',async()=>{let file=b.dataset.file;try{const r=await fetch('/'+file);if(!r.ok)throw new Error('HTTP '+r.status);await show(await r.arrayBuffer(),file)}catch(e){window.__cadTestResult={success:false,error:e.message};document.getElementById('status').textContent='실패'}});
document.getElementById('upload').addEventListener('change',async e=>{if(e.target.files[0])await show(await e.target.files[0].arrayBuffer(),e.target.files[0].name)});
new ResizeObserver(()=>{const w=Math.max(el.clientWidth,10),h=Math.max(el.clientHeight,10);renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(el);
function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,cam)}frame();
</script></body></html>
